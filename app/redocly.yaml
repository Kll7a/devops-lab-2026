extends:
  - recommended

rules:
  # Учебный/демо-сервис: без публичного адреса и без авторизации — это
  # осознанное упрощение, задокументированное в README ("Известные упрощения").
  no-empty-servers: off
  security-defined: off

  # Хотим со временем описывать коды ошибок — понижаем до предупреждения,
  # чтобы это не блокировало CI уже сейчас, но было видно в логах.
  operation-4xx-response: warn
  info-license: warn
