receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317

processors:
  batch: {}                 # копит телеметрию пачками — меньше сетевых вызовов

exporters:
  prometheus:               # отдаёт метрики на /metrics для локального просмотра
    endpoint: 0.0.0.0:8889
  debug:                    # трейсы печатаем в лог — backend появится на дне 5
    verbosity: basic

service:
  pipelines:
    metrics:
      receivers: [otlp]
      processors: [batch]
      exporters: [prometheus]
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [debug]
