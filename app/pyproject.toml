[project]
name = "demo-api"
version = "1.0.0"
requires-python = ">=3.13"

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
# E/F — ошибки и стиль, I — порядок импортов, B — типичные баги, UP — устаревший синтаксис
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["S101"]   # assert в тестах разрешаем

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
